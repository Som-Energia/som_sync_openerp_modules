name: CI (Odoo Enterprise + Integration)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  odoo-setup:
    runs-on: ubuntu-latest

    steps:
      # 1) Check out el codi
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # 2) Clonar repositori d'Enterprise (si hi ha secret SSH)
      - name: Clone Enterprise Addons
        run: |
          mkdir enterprise_addons
          git clone "https://$GITHUB_TOKEN@github.com/puntsistemes/som-energia_odoo.git" $ROOT_DIR_SRC/punt_addons
        env:
          SSH_AUTH_SOCK: /tmp/ssh_agent.sock
          GITHUB_TOKEN: ${{ secrets.ACCESS_TOKEN_GA }}

      # 3) Crear un docker-compose dinàmic
      - name: Generate docker-compose with Odoo Enterprise
        run: |
          cat > docker-compose.yml << 'EOF'
          version: "3.9"
          services:
            db:
              image: postgres:14
              environment:
                POSTGRES_DB: odoo
                POSTGRES_USER: odoo
                POSTGRES_PASSWORD: odoo
              healthcheck:
                test: ["CMD", "pg_isready", "-U", "odoo"]
                interval: 5s
                timeout: 5s
                retries: 5
            odoo:
              image: focuz/odoo_enterprise:latest
              depends_on:
                db:
                  condition: service_healthy
              environment:
                - POSTGRES_USER=odoo
                - POSTGRES_PASSWORD=odoo
                - POSTGRES_DB=odoo
                - POSTGRES_HOST=db
                - ADDONS_PATH=/mnt/addons,/mnt/enterprise
              volumes:
                - ./enterprise_addons:/mnt/enterprise
                - .:/mnt/addons
              ports:
                - "8069:8068"
              healthcheck:
                test: ["CMD", "curl", "-f", "http://localhost:8068"]
                timeout: 5s
                interval: 10s
                retries: 6
          EOF

      # 4) Aixequem l'entorn
      - name: Start services
        run: |
          docker compose up -d db odoo

      # 5) Wait for Odoo to be up
      - name: Wait for Odoo ready
        run: |
          echo "Waiting for Odoo Enterprise on http://localhost:8068..."
          until curl -s http://localhost:8068; do sleep 5; done

  erp-tests-module:
    uses: Som-Energia/openerp_som_addons/.github/workflows/reusable_workflow.yml@main
    with:
      module: som_sync_openerp
      pyversion: '["2.7"]'
    secrets:
      ACCESS_TOKEN_GA: ${{ secrets.ACCESS_TOKEN_GA }}
      ESIOS_TOKEN: ${{ secrets.ESIOS_TOKEN }}
      SRID: ${{ secrets.SRID }}
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  integration-test:
    name: Integratin tests
    runs-on: ubuntu-latest
    needs: erp-tests-module
    steps:
      # 6) Executar tests d'integració continue-on-error:
      - name: Run integration tests
        run: |
          # Llençar tests d'integració

      # 7) Cleanup
      - name: Tear down services
        if: always()
        run: |
          docker compose down -v
